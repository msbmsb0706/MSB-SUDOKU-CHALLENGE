name: Build MSB Sudoku Deliverables

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STORE_PASSWORD: android123
      KEY_PASSWORD: android123
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Build Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          validate-wrappers: false

      - name: Inject Google AI Studio API Key Safely
        run: |
          echo "apiKey=${{ secrets.GEMINI_API_KEY }}" >> local.properties
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties

      - name: Create release keystore automatically
        run: |
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MSB Creative Studios, O=MSB Creative Studios, L=Chennai, C=IN"

      - name: Build Code Packages
        run: gradle assembleRelease bundleRelease -x lint -x test --no-configuration-cache --stacktrace
        env:
          MY_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # ✅ Signs with BOTH v1 and v2 signature layers so it opens perfectly on Android 9 through Android 12+
      - name: Sign Release APK for Android 9 and Modern Devices
        run: |
          UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME}/build-tools/* | tail -n 1)
          
          $BUILD_TOOLS_DIR/apksigner sign --ks "$KEYSTORE_PATH" \
            --ks-pass pass:"$STORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --ks-key-alias upload \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out app/build/outputs/apk/release/MSB-Sudoku-Challenge-Signed.apk \
            "$UNSIGNED_APK"

      # Verifies the package signature formats to ensure it passes all device verification layers
      - name: Verify Signed APK Package
        run: |
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME}/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/apksigner verify --verbose app/build/outputs/apk/release/MSB-Sudoku-Challenge-Signed.apk

      <div align="center">
      </div>

      <br>

      - name: Consolidate Deliverables
        run: |
          cp my-upload-key.jks app/build/outputs/apk/release/

      - name: Upload Complete Studio Package
        uses: actions/upload-artifact@v4
        with:
          name: MSB-SUDOKU-COMPLETE-PACKAGE
          path: |
            app/build/outputs/apk/release/MSB-Sudoku-Challenge-Signed.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/my-upload-key.jks
