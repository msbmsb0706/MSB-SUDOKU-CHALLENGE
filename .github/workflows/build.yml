name: Build MSB Sudoku Deliverables

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STORE_PASSWORD: android123
      KEY_PASSWORD: android123
      KEY_ALIAS: upload
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Build Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          validate-wrappers: false

      - name: Inject Google AI Studio API Key Safely
        run: |
          echo "apiKey=${{ secrets.GEMINI_API_KEY }}" >> local.properties
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties

      - name: Decode Existing Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"

      # ✅ USES THE GRADLE ACTION DIRECTLY (Bypassing the corrupt jarfile)
      - name: Build Code Packages
        uses: gradle/actions/setup-gradle@v4
        with:
          arguments: assembleRelease bundleRelease -x lint -x test --no-configuration-cache --stacktrace
        env:
          MY_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Sign Release APK
        run: |
          UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME}/build-tools/* | tail -n 1)
          
          $BUILD_TOOLS_DIR/apksigner sign --ks "$KEYSTORE_PATH" \
            --ks-pass pass:"$STORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out app/build/outputs/apk/release/MSB-Sudoku-Challenge-Signed.apk \
            "$UNSIGNED_APK"

      - name: Upload Complete Studio Package
        uses: actions/upload-artifact@v4
        with:
          name: MSB-SUDOKU-COMPLETE-PACKAGE
          path: |
            app/build/outputs/apk/release/MSB-Sudoku-Challenge-Signed.apk
            app/build/outputs/bundle/release/*.aab
          path: app/build/outputs/bundle/debug/app-debug.aab
