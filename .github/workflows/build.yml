name: Build APK and AAB

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Build Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          validate-wrappers: false

      - name: Grant Execute Permissions to Gradle
        run: chmod +x lint || true

      # This step takes your GitHub secret, turns it back into a physical .jks file on the runner safely
      - name: Decrypt Keystore File
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore/release.jks
        if: "${{ secrets.KEYSTORE_BASE64 != '' }}"

      - name: Build Signed APK & AAB (Release)
        run: gradle assembleRelease bundleRelease -x lint -x test --no-configuration-cache --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed App Packages (APK & AAB)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MSB-Sudoku-Release-Packages
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
