name: Build MSB Sudoku Deliverables

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STORE_PASSWORD: android123
      KEY_PASSWORD: android123
      KEY_ALIAS: upload
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Existing Keystore File
        run: printf "%s" "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"

      - name: Build with Gradle 9.3.1
        run: |
          rm -rf gradle-9.3.1*
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip
          
          # JVM flag placed correctly before the executable binary to force headless mode for KSP
          ./gradle-9.3.1/bin/gradle -Djava.awt.headless=true assembleRelease bundleRelease --no-configuration-cache --stacktrace
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Sign Release APK
        run: |
          BUILD_TOOLS_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | sort -r | head -n1)
          APK_SIGNER="/usr/local/lib/android/sdk/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          
          UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          
          $APK_SIGNER sign --ks "$KEYSTORE_PATH" \
            --ks-pass pass:"$STORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out app/build/outputs/apk/release/MSB-Sudoku-Challenge-Signed.apk \
            "$UNSIGNED_APK"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MSB-SUDOKU-COMPLETE-PACKAGE
          path: |
            app/build/outputs/apk/release/MSB-Sudoku-Challenge-Signed.apk
            app/build/outputs/bundle/release/*.aab
