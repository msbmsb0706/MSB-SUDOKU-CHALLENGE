      - name: Build Unsigned APK
        run: gradle assembleRelease --stacktrace

      - name: Sign APK
        run: |
          # Use the debug keystore for easy local testing
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks "${{ env.KEYSTORE_PATH }}" \
          --ks-key-alias upload \
          --ks-pass pass:android123 \
          --key-pass pass:android123 \
          app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-MSB-SUDOKU-CHALLENGE-signed
          path: app/build/outputs/apk/release/app-release-unsigned.apk
