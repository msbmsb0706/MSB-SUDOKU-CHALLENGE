name: Build MSB Sudoku Deliverables

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STORE_PASSWORD: android123
      KEY_PASSWORD: android123
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Build Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          validate-wrappers: false

      # ✅ Overwrites the placeholder text with your real GitHub secret key string
      - name: Inject Google AI Studio API Key Safely
        run: |
          echo "apiKey=${{ secrets.GEMINI_API_KEY }}" >> local.properties
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties
          find . -type f \( -name "*.properties" -o -name "*.kt" -o -name "*.xml" -o -name "*.txt" \) -exec sed -i 's/MY_GEMINI_API_KEY/${{ secrets.GEMINI_API_KEY }}/g' {} +

      - name: Create release keystore automatically
        run: |
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MSB Creative Studios, O=MSB Creative Studios, L=Chennai, C=IN"

      - name: Build Code Packages
        run: gradle assembleRelease bundleRelease -x lint -x test --no-configuration-cache --stacktrace

      - name: Consolidate Deliverables
        run: |
          cp my-upload-key.jks app/build/outputs/apk/release/

      - name: Upload Complete Studio Package
        uses: actions/upload-artifact@v4
        with:
          name: MSB-SUDOKU-COMPLETE-PACKAGE
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/my-upload-key.jks
