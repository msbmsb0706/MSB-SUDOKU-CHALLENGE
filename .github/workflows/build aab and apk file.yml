name: Build APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STORE_PASSWORD: android123
      KEY_PASSWORD: android123
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MSB Creative Studios, OU=MSB, O=MSB, L=Chennai, S=Tamil Nadu, C=IN"

      - name: Repair Wrapper and Build
        run: |
          # 1. Clean the wrapper and force regeneration to fix corrupt jarfile
          rm -f gradle/wrapper/gradle-wrapper.jar
          # Use a pre-installed gradle to generate the wrapper if gradlew is currently failing
          gradle wrapper --gradle-version 9.3.1
          
          # 2. Set permissions
          chmod +x gradlew
          
          # 3. Clean and build artifacts
          ./gradlew clean assembleRelease bundleRelease --stacktrace

      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks "$KEYSTORE_PATH" \
          --ks-key-alias upload \
          --ks-pass pass:$STORE_PASSWORD \
          --key-pass pass:$KEY_PASSWORD \
          app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-MSB-SUDOKU-CHALLENGE-signed-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-MSB-SUDOKU-CHALLENGE-aab
          path: app/build/outputs/bundle/release/app-release.aab
