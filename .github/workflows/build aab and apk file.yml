name: Build APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STORE_PASSWORD: android123
      KEY_PASSWORD: android123
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: android-actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MSB Creative Studios, OU=MSB, O=MSB, L=Chennai, S=Tamil Nadu, C=IN"

      - name: Repair Wrapper and Build
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          ./gradlew clean assembleRelease bundleRelease --stacktrace

      - name: Sign APK
        run: |
          # 1. List contents to debug path
          echo "Debug: Listing files in release directory:"
          ls -R app/build/outputs/apk/release/ || echo "Directory does not exist"
          
          # 2. Find the APK file dynamically
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found in output directory!"
            exit 1
          fi
          
          echo "Signing file: $APK_FILE"
          
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks "$KEYSTORE_PATH" \
          --ks-key-alias upload \
          --ks-pass pass:$STORE_PASSWORD \
          --key-pass pass:$KEY_PASSWORD \
          "$APK_FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-MSB-SUDOKU-CHALLENGE-signed-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-MSB-SUDOKU-CHALLENGE-aab
          path: app/build/outputs/bundle/release/*.aab
