on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STORE_PASSWORD: android123
      KEY_PASSWORD: android123
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --- NEW STRATEGY: FORCE GRADLE DOWNLOAD ---
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          # We remove the jar reliance by forcing the runner to install the version
      
      # Build using the Gradle binary directly installed by setup-gradle
      - name: Build Signed Release AAB
        run: gradle bundleRelease --stacktrace

      # ... (rest of your steps for keystore, uploading, etc.)
