name: Arena Diagnostic Build

# TEMPORARY diagnostic workflow (arena working branch only).
# It reproduces the release build from build.yml and, instead of leaving the
# Gradle output in the (hard to reach) Actions log blob storage, publishes the
# tail of the log to a check-run summary + commit comment, which can be read
# over the REST API. Remove this file once the build is green again.

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: arena-diagnose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      STORE_PASSWORD: android123
      KEY_PASSWORD: android123
      KEY_ALIAS: upload
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fetch Gradle 9.3.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip

      - name: Decode keystore
        run: printf "%s" "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"

      - name: Build with Gradle 9.3.1 (log captured)
        continue-on-error: true
        run: |
          ./gradle-9.3.1/bin/gradle -Djava.awt.headless=true -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -Djava.awt.headless=true" assembleRelease bundleRelease --no-configuration-cache --stacktrace > "$RUNNER_TEMP/build.log" 2>&1
          echo "GRADLE_EXIT_CODE=$?" >> "$RUNNER_TEMP/build.log"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Publish diagnostics
        if: always()
        run: |
          set -x
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || echo "no log file produced" > "$LOG"
          tail -c 60000 "$LOG" > "$RUNNER_TEMP/tail.log"

          {
            echo "## Gradle log tail ($(wc -c < "$LOG") bytes total)"
            echo '```'
            cat "$RUNNER_TEMP/tail.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          python3 - > "$RUNNER_TEMP/check.json" <<'PY'
          import json, os, sys
          text = open(os.environ["RUNNER_TEMP"] + "/tail.log", encoding="utf-8", errors="replace").read()
          print(json.dumps({
              "name": "arena-diagnose",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": "failure",
              "output": {"title": "gradle log tail", "summary": text[:60000] or "(empty)"},
          }))
          PY

          gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" --input "$RUNNER_TEMP/check.json" > /dev/null \
            || echo "!! check-run publish failed"

          gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$(head -c 60000 "$RUNNER_TEMP/tail.log")" > /dev/null \
            || echo "!! commit comment publish failed"
