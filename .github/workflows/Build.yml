name: Build Production AAB
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode Permanent Keystore
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean bundleRelease
        env:
          # These must be set in your Repo Secrets
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSB-SUDOKU-CHALLENGE-AAB
          path: app/build/outputs/bundle/release/*.aab
